<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gửi em, một chút yêu thương 💗</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:linear-gradient(135deg,#fff0f5,#fce0e8,#fff6ed);font-family:system-ui,sans-serif;color:#794052;overflow-x:hidden}main{width:min(90vw,480px);text-align:center;position:relative;z-index:1}.card{background:#ffffffd9;border:1px solid white;border-radius:32px;padding:34px 24px;box-shadow:0 20px 70px #b95d7926;min-height:420px;display:flex;flex-direction:column;justify-content:center;align-items:center}.art{font-size:90px;animation:bob 3s ease-in-out infinite}h1{font-size:clamp(24px,6vw,34px);line-height:1.25;margin:20px 0 10px}p{line-height:1.7;font-size:16px;margin:8px 0 22px}button{font:inherit;font-weight:600;border:0;border-radius:99px;padding:13px 22px;background:#e66b91;color:white;cursor:pointer;box-shadow:0 5px 15px #e66b9133}button.secondary{background:#f9e8ee;color:#91475f;box-shadow:none}button:focus-visible{outline:3px solid #91475f;outline-offset:4px}.nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.dots{display:flex;justify-content:center;gap:8px;margin:22px}.dot{width:8px;height:8px;border-radius:20px;background:#e6b7c5;transition:.3s}.dot.on{width:24px;background:#e66b91}.small{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#aa7084}.heart{position:fixed;bottom:-40px;pointer-events:none;animation:float linear infinite;opacity:.45}.enter{animation:enter .55s both}@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes bob{50%{transform:translateY(-9px) rotate(4deg)}}@keyframes float{to{transform:translateY(-115vh) rotate(35deg)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.heart{display:none}}</style><main><div class="small">Một lá thư nhỏ dành cho em</div><div class="dots" id="dots"></div><section class="card" id="card" aria-live="polite"><div class="art" id="art"></div><h1 id="heading"></h1><p id="message"></p><div class="nav" id="nav"></div></section><p class="small">Made with love ♡</p><div style="font-size:12px;line-height:1.5;margin-bottom:16px"><label><input type="checkbox" id="consent"> Em đồng ý gửi tiến độ đọc thư cho anh.</label><p style="font-size:12px;margin:6px">Không bắt buộc. Nút phản hồi sẽ gửi lựa chọn của em nếu em xác nhận.</p><span id="status" role="status"></span></div></main><script src="config.js"></script><script>
const session=globalThis.crypto?.randomUUID?.() || String(Date.now())+Math.random();
const seen=new Set();
async function send(event,slide=0){
 const url=window.LOVE_ENDPOINT;
 if(!url || !url.startsWith('https://script.google.com/')) return false;
 try {await fetch(url,{method:'POST',mode:'no-cors',body:new URLSearchParams({event,slide:String(slide),session})});return true;}catch(e){return false;}
}
function track(){if(!$('consent').checked || seen.has(i))return;const current=i;seen.add(current);send('slide',current+1).then(ok=>{if(!ok)seen.delete(current);});}

// Sửa lời nhắn ở đây để phù hợp với câu chuyện của hai bạn.
const slides=[['💌','Bé ơi, anh có chuyện muốn nói…','Em dành cho anh một chút thời gian nhé? Anh có một lá thư nhỏ muốn gửi em.'],['🥺','Anh biết anh đã làm em buồn.','Anh đã suy nghĩ về những gì xảy ra. Anh rất tiếc vì những điều anh làm đã khiến em tổn thương.'],['🐻','Anh xin lỗi em.','Xin lỗi vì đã không để ý đến cảm xúc của em. Em xứng đáng được lắng nghe và quan tâm nhiều hơn.'],['🌷','Không có lời biện minh nào cả.','Anh muốn nhận trách nhiệm về những gì mình đã làm, thay vì tìm lý do để giải thích cho qua.'],['🧸','Anh muốn làm tốt hơn.','Anh sẽ học cách lắng nghe, bình tĩnh hơn và thể hiện sự quan tâm bằng những hành động thật sự.'],['💗','Em rất đặc biệt với anh.','Anh trân trọng những khoảnh khắc chúng mình ở bên nhau, cả những điều nhỏ bé mà đôi khi anh quên nói ra.'],['🤍','Cho anh một cơ hội sửa sai nhé?','Anh không mong em phải hết buồn ngay. Anh tôn trọng cảm xúc và thời gian của em.']];
let i=0;const $=id=>document.getElementById(id);function btn(t,f,secondary=false){let b=document.createElement('button');b.textContent=t;b.onclick=f;if(secondary)b.className='secondary';$('nav').append(b)}function render(){let s=slides[i];$('art').textContent=s[0];$('heading').textContent=s[1];$('message').textContent=s[2];$('dots').innerHTML=slides.map((_,j)=>`<span class="dot ${j===i?'on':''}"></span>`).join('');$('nav').replaceChildren();if(i>0)btn('←',()=>{i--;render()},true);if(i<slides.length-1)btn(i===0?'Mở thư 💌':'Tiếp theo ♡',()=>{i++;render()});else{btn('Cho anh cơ hội 💗',()=>finish(true));btn('Em cần thêm thời gian',()=>finish(false),true)}$('card').classList.remove('enter');void $('card').offsetWidth;$('card').classList.add('enter');track()}async function finish(ok){
const share=confirm('Em có muốn gửi lựa chọn này cho anh không? Chọn Hủy để chỉ xem lời nhắn trên máy em.');
if(share){const sent=await send(ok?'accepted':'need_time');$('status').textContent=sent?'Đã gửi yêu cầu phản hồi (chưa xác nhận máy chủ nhận).':'Chưa gửi được phản hồi. Em có thể thử lại.';}
$('art').textContent=ok?'🫶':'🌷';$('heading').textContent=ok?'Cảm ơn em nhiều lắm!':'Anh hiểu mà.';$('message').textContent=ok?'Anh sẽ trân trọng cơ hội này và cố gắng bằng hành động.':'Em cứ dành thời gian cho mình nhé. Khi em sẵn sàng, anh sẽ lắng nghe.';$('nav').replaceChildren();btn('Đọc lại lá thư ↺',()=>{i=0;render()},true);if(ok)for(let j=0;j<25;j++)heart(j,true)}function heart(j,burst=false){let h=document.createElement('span');h.className='heart';h.textContent=['♡','♥','✦'][j%3];h.style.left=Math.random()*100+'vw';h.style.fontSize=12+Math.random()*22+'px';h.style.color='#df7195';h.style.animationDuration=(burst?3:8+Math.random()*9)+'s';h.style.animationDelay=(burst?Math.random():-Math.random()*15)+'s';if(burst){h.style.animationIterationCount=1;h.addEventListener('animationend',()=>h.remove())}document.body.append(h)}for(let j=0;j<16;j++)heart(j);render();$('consent').addEventListener('change',()=>{if($('consent').checked){send('opened');track();}else{seen.clear();}});</script></html>
