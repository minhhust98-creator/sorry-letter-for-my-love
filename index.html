<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gửi em, một chút yêu thương 💗</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:linear-gradient(135deg,#fff0f5,#fce0e8,#fff6ed);font-family:system-ui,sans-serif;color:#794052;overflow-x:hidden}main{width:min(90vw,480px);text-align:center;position:relative;z-index:1}.card{background:#ffffffd9;border:1px solid white;border-radius:32px;padding:34px 24px;box-shadow:0 20px 70px #b95d7926;min-height:420px;display:flex;flex-direction:column;justify-content:center;align-items:center}.art{font-size:90px;animation:bob 3s ease-in-out infinite}h1{font-size:clamp(24px,6vw,34px);line-height:1.25;margin:20px 0 10px}p{line-height:1.7;font-size:16px;margin:8px 0 22px}button{font:inherit;font-weight:600;border:0;border-radius:99px;padding:13px 22px;background:#e66b91;color:white;cursor:pointer;box-shadow:0 5px 15px #e66b9133}button.secondary{background:#f9e8ee;color:#91475f;box-shadow:none}button:focus-visible{outline:3px solid #91475f;outline-offset:4px}.nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.dots{display:flex;justify-content:center;gap:8px;margin:22px}.dot{width:8px;height:8px;border-radius:20px;background:#e6b7c5;transition:.3s}.dot.on{width:24px;background:#e66b91}.small{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#aa7084}.heart{position:fixed;bottom:-40px;pointer-events:none;animation:float linear infinite;opacity:.45}.enter{animation:enter .55s both}@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes bob{50%{transform:translateY(-9px) rotate(4deg)}}@keyframes float{to{transform:translateY(-115vh) rotate(35deg)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.heart{display:none}}</style><main><div class="small">Một lá thư nhỏ dành cho em</div><div class="dots" id="dots"></div><section class="card" id="card" aria-live="polite"><div class="art" id="art"></div><h1 id="heading"></h1><p id="message"></p><div class="nav" id="nav"></div></section><p class="small">Made with love ♡</p><div style="font-size:12px;line-height:1.5;margin-bottom:16px"><span id="status" role="status"></span></div></main><script src="config.js"></script><script>
const session=globalThis.crypto?.randomUUID?.() || String(Date.now())+Math.random();

async function send(event,slide=0){
 const url=window.LOVE_ENDPOINT;
 if(!url || !url.startsWith('https://script.google.com/')) return false;
 try {await fetch(url,{method:'POST',mode:'no-cors',body:new URLSearchParams({event,slide:String(slide),session})});return true;}catch(e){return false;}
}

// Sửa lời nhắn ở đây để phù hợp với câu chuyện của hai bạn.
const slides=[['💌','Thỏ ơi, tớ có chuyện muốn nói…','Thỏ dành cho tớ một chút thời gian nhé? Tớ có một lá thư nhỏ muốn gửi Thỏ.'],['🥺','Tớ biết tớ đã làm Thỏ buồn.','Tớ đã suy nghĩ về những gì xảy ra. Tớ rất tiếc vì những điều tớ làm đã khiến Thỏ tổn thương.'],['🐰','Tớ xin lỗi Thỏ.','Xin lỗi vì đã không để ý đến cảm xúc của Thỏ. Thỏ xứng đáng được lắng nghe và quan tâm nhiều hơn.'],['🌷','Chẳng có lời biện minh nào cả.','Tớ muốn nhận trách nhiệm về những gì mình đã làm, thay vì tìm lý do để giải thích cho qua.'],['🐇','Tớ muốn làm tốt hơn.','Tớ sẽ học cách lắng nghe, bình tĩnh hơn và thể hiện sự quan tâm bằng những hành động đúng mực.'],['💗','Thỏ rất đặc biệt với tớ.','Tớ trân trọng những khoảnh khắc chúng mình ở bên nhau, cả những điều nhỏ bé mà đôi khi tớ quên nói ra.'],['🤍','Cho tớ một cơ hội sửa sai nhé?','Tớ không mong em phải hết buồn ngay. Tớ tôn trọng cảm xúc và thời gian của Thỏ, nhưng đừng reject người ta nhớ.']];
let i=0;const $=id=>document.getElementById(id);function btn(t,f,secondary=false){let b=document.createElement('button');b.textContent=t;b.onclick=f;if(secondary)b.className='secondary';$('nav').append(b)}function render(){let s=slides[i];$('art').textContent=s[0];$('heading').textContent=s[1];$('message').textContent=s[2];$('dots').innerHTML=slides.map((_,j)=>`<span class="dot ${j===i?'on':''}"></span>`).join('');$('nav').replaceChildren();if(i>0)btn('←',()=>{i--;render()},true);if(i<slides.length-1)btn(i===0?'Mở thư 💌':'Tiếp theo ♡',()=>{i++;render()});else{btn('Gửi: Cho bạn Minh xấu xa cơ hội 💗',()=>finish(true));btn('Gửi: Thỏ cần thêm thời gian',()=>finish(false),true)}$('card').classList.remove('enter');void $('card').offsetWidth;$('card').classList.add('enter');}async function finish(ok){
if(document.querySelector('#nav button:disabled'))return;
document.querySelectorAll('#nav button').forEach(b=>b.disabled=true);
const sent=await send(ok?'accepted':'need_time');
$('status').textContent=sent?'Đã gửi yêu cầu phản hồi (chưa xác nhận máy chủ nhận).':'Chưa gửi được phản hồi. Thỏ có thể thử lại.';
if(!sent){document.querySelectorAll('#nav button').forEach(b=>b.disabled=false);return;}
$('art').textContent=ok?'🫶':'🌷';$('heading').textContent=ok?'Cảm ơn Thỏ nhiều lắm!':'Tớ hiểu mà.';$('message').textContent=ok?'Tớ sẽ trân trọng cơ hội này và cố gắng bằng hành động.':'Thỏ cứ dành thời gian cho mình nhé. Khi Thỏ sẵn sàng, tớ sẽ lắng nghe.';$('nav').replaceChildren();btn('Đọc lại lá thư ↺',()=>{i=0;render()},true);if(ok)for(let j=0;j<25;j++)heart(j,true)}function heart(j,burst=false){let h=document.createElement('span');h.className='heart';h.textContent=['♡','♥','✦'][j%3];h.style.left=Math.random()*100+'vw';h.style.fontSize=12+Math.random()*22+'px';h.style.color='#df7195';h.style.animationDuration=(burst?3:8+Math.random()*9)+'s';h.style.animationDelay=(burst?Math.random():-Math.random()*15)+'s';if(burst){h.style.animationIterationCount=1;h.addEventListener('animationend',()=>h.remove())}document.body.append(h)}for(let j=0;j<16;j++)heart(j);render();</script></html>
